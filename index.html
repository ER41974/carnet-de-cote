<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carnet de Cote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<style>
/* ============================ TOKENS ============================ */
:root{
  --paper:#F1F4F3;
  --surface:#FFFFFF;
  --surface-2:#F7F9F8;
  --line:#DCE3E1;
  --line-strong:#C3CECB;
  --ink:#141A19;
  --ink-2:#3E4A48;
  --muted:#6B7A77;
  --accent:#155E63;
  --accent-soft:#DFECEC;
  --gain:#186B45;
  --gain-soft:#E0F0E8;
  --loss:#B33A2B;
  --loss-soft:#F8E5E1;
  --warn:#966511;
  --warn-soft:#F7EEDA;
  --shadow:0 1px 2px rgba(20,26,25,.05), 0 6px 20px -10px rgba(20,26,25,.18);
  --c1:#2F5FA8; --c2:#C4622D; --c3:#1E8F6E; --c4:#A8478E;
  --c5:#7A8B2E; --c6:#2A86B0; --c7:#B33A3A; --c8:#6B5BC0;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1413;
    --surface:#171E1D;
    --surface-2:#1D2524;
    --line:#2A3432;
    --line-strong:#3B4745;
    --ink:#E8EDEB;
    --ink-2:#BCC7C4;
    --muted:#8C9996;
    --accent:#5FB6B8;
    --accent-soft:#17302F;
    --gain:#4FBE86;
    --gain-soft:#122C21;
    --loss:#E1705B;
    --loss-soft:#331914;
    --warn:#D9A441;
    --warn-soft:#2E2413;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    --c1:#4A79C4; --c2:#DA7B45; --c3:#35A784; --c4:#C062A6;
    --c5:#93A542; --c6:#45A0CA; --c7:#CE5A56; --c8:#8878DA;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1413;
  --surface:#171E1D;
  --surface-2:#1D2524;
  --line:#2A3432;
  --line-strong:#3B4745;
  --ink:#E8EDEB;
  --ink-2:#BCC7C4;
  --muted:#8C9996;
  --accent:#5FB6B8;
  --accent-soft:#17302F;
  --gain:#4FBE86;
  --gain-soft:#122C21;
  --loss:#E1705B;
  --loss-soft:#331914;
  --warn:#D9A441;
  --warn-soft:#2E2413;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  --c1:#4A79C4; --c2:#DA7B45; --c3:#35A784; --c4:#C062A6;
  --c5:#93A542; --c6:#45A0CA; --c7:#CE5A56; --c8:#8878DA;
}

/* ============================ BASE ============================ */
*{box-sizing:border-box}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.pos{color:var(--gain)} .neg{color:var(--loss)}
.hide{display:none !important}

/* ============================ SHELL ============================ */
.app{max-width:1240px;margin:0 auto;padding:0 20px 72px}

.topbar{
  position:sticky;top:0;z-index:40;background:var(--paper);
  border-bottom:1px solid var(--line);
}
.topbar-in{
  max-width:1240px;margin:0 auto;padding:14px 20px 12px;
  display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;
}
.brand{display:flex;flex-direction:column;gap:2px;margin-right:auto}
.brand h1{
  font-family:Fraunces,Georgia,serif;font-weight:700;font-size:23px;
  letter-spacing:-.015em;line-height:1.05;
}
.brand .sub{font-size:11.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.hero-figure{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.hero-figure .v{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1}
.hero-figure .d{font-size:12.5px;font-variant-numeric:tabular-nums;font-family:"IBM Plex Mono",monospace}
.topactions{display:flex;gap:8px;align-items:center}

.btn{
  border:1px solid var(--line-strong);background:var(--surface);
  padding:7px 13px;border-radius:8px;font-size:13px;font-weight:500;
  display:inline-flex;align-items:center;gap:7px;transition:background .15s,border-color .15s;
}
.btn:hover{background:var(--surface-2);border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary,
:root:not([data-theme="light"]) .btn.primary{color:#08110F}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .btn.primary{color:#fff}}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2);border-color:var(--line)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

nav.views{
  display:flex;gap:2px;padding:10px 0 0;flex-wrap:wrap;
}
nav.views button{
  border:0;background:transparent;padding:8px 13px 11px;font-size:13.5px;font-weight:500;
  color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;
}
nav.views button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
nav.views button:hover{color:var(--ink)}

/* ============================ CARDS ============================ */
.panel{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
}
.panel-head{
  display:flex;align-items:baseline;gap:12px;padding:14px 16px 10px;flex-wrap:wrap;
}
.panel-head h2{font-size:14px;font-weight:600;letter-spacing:-.005em}
.panel-head .note{font-size:12px;color:var(--muted);margin-left:auto}

.grid{display:grid;gap:16px}
.section{margin-top:20px}
.eyebrow{
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  font-weight:600;margin:26px 0 10px;display:flex;align-items:center;gap:10px;
}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}

/* KPI strip — one surface, hairline cells (not 4 floating cards) */
.kpis{
  display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
}
.kpi{padding:14px 16px 15px;border-left:1px solid var(--line)}
.kpi:first-child{border-left:0}
.kpi .k{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:21px;font-weight:600;letter-spacing:-.02em;margin-top:5px;line-height:1.15}
.kpi .m{font-size:12px;color:var(--muted);margin-top:2px}

/* ============================ TABLE ============================ */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:1240px}
thead th{
  position:sticky;top:0;background:var(--surface);z-index:2;
  font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);
  font-weight:600;text-align:right;padding:9px 10px;border-bottom:1px solid var(--line-strong);
  white-space:nowrap;cursor:pointer;user-select:none;
}
thead th:first-child,thead th.l{text-align:left}
thead th .arrow{opacity:.45;font-size:9px}
tbody td{
  padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
tbody td:first-child,tbody td.l{text-align:left}
tbody tr:hover{background:var(--surface-2)}
tfoot td{padding:10px;border-top:2px solid var(--line-strong);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tfoot td.l{text-align:left}
tbody tr.dim td{opacity:.55}
.tick{font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.nm{font-weight:500}
.cell-name{display:flex;flex-direction:column;gap:0px;min-width:150px}
td .mono{font-family:"IBM Plex Mono",monospace}

.pill{
  display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;
  font-size:11px;font-weight:600;letter-spacing:.01em;white-space:nowrap;
}
.pill.g{background:var(--gain-soft);color:var(--gain)}
.pill.r{background:var(--loss-soft);color:var(--loss)}
.pill.w{background:var(--warn-soft);color:var(--warn)}
.pill.n{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.a{background:var(--accent-soft);color:var(--accent)}
.dot{width:8px;height:8px;border-radius:2px;display:inline-block;flex:none}

.acct{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);font-weight:500}

/* severity rail on rows that need attention */
tbody tr td:first-child{border-left:3px solid transparent;padding-left:9px}
tbody tr.sev-w td:first-child{border-left-color:var(--warn)}
tbody tr.sev-g td:first-child{border-left-color:var(--gain)}
tbody tr.sev-r td:first-child{border-left-color:var(--loss)}

/* ============================ CHARTS ============================ */
.chart{width:100%;display:block;overflow:visible}
.chart text{font-family:"IBM Plex Mono",monospace;font-size:10px;fill:var(--muted)}
.gridline{stroke:var(--line);stroke-width:1}
.axisline{stroke:var(--line-strong);stroke-width:1}
.tip{
  position:fixed;pointer-events:none;z-index:80;background:var(--surface);
  border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;box-shadow:var(--shadow);
  font-size:12px;min-width:120px;opacity:0;transition:opacity .1s;
}
.tip .t{font-weight:600;margin-bottom:4px;font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.tip .row{display:flex;justify-content:space-between;gap:14px;font-variant-numeric:tabular-nums}

.stack{display:flex;height:26px;border-radius:6px;overflow:hidden;gap:2px;background:transparent}
.stack > span{display:block;height:100%;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px}
.legend .li{display:flex;align-items:center;gap:7px;font-size:12px}
.legend .li .n{color:var(--muted);font-variant-numeric:tabular-nums}

.barlist{display:flex;flex-direction:column;gap:9px}
.barrow{display:grid;grid-template-columns:132px 1fr 76px;gap:10px;align-items:center;font-size:12.5px}
.bartrack{height:9px;background:var(--surface-2);border-radius:2px;position:relative;border:1px solid var(--line)}
.barfill{position:absolute;top:0;bottom:0;border-radius:2px}
.barrow .val{text-align:right;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:12px}
.barrow .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ============================ FORMS ============================ */
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
input[type=text],input[type=number],input[type=date],select,textarea{
  background:var(--surface);border:1px solid var(--line-strong);border-radius:7px;
  padding:7px 9px;font-size:13px;width:100%;
}
textarea{font-family:"IBM Plex Mono",monospace;font-size:12px;line-height:1.55;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
td input{padding:4px 6px;border-radius:5px;font-family:"IBM Plex Mono",monospace;font-size:12px;text-align:right;min-width:74px}
td input.l{text-align:left}

.modal-back{
  position:fixed;inset:0;background:rgba(10,16,15,.5);z-index:90;
  display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 16px;overflow-y:auto;
}
.modal{
  background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;
  box-shadow:var(--shadow);width:100%;max-width:620px;padding:20px;
  /* la modale ne dépasse jamais l'écran : c'est son contenu qui défile,
     jamais les boutons de validation qui partent hors de vue */
  max-height:88vh;display:flex;flex-direction:column;overflow:hidden;
}
.modal > *{flex:none}
.modal .body{flex:1 1 auto;overflow-y:auto;margin:0 -20px;padding:0 20px}
.modal h3{font-family:Fraunces,Georgia,serif;font-size:19px;font-weight:700;margin-bottom:4px}
.modal .lead{color:var(--muted);font-size:13px;margin:0 0 16px}
.modal .actions{
  display:flex;gap:8px;justify-content:flex-end;align-items:center;
  margin:16px -20px -20px;padding:14px 20px;
  border-top:1px solid var(--line);background:var(--surface-2);
}
.modal .actions .hint{margin-right:auto;font-size:12px;color:var(--muted)}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(8px);
  background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:9px;font-size:13px;
  z-index:100;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;box-shadow:var(--shadow);
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:13px}
.callout{
  display:flex;gap:11px;padding:12px 14px;border-radius:var(--r);font-size:12.5px;line-height:1.5;
  background:var(--warn-soft);border:1px solid var(--line);color:var(--ink-2);
}
.callout b{color:var(--ink)}
.callout.a{background:var(--accent-soft)}

.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:12.5px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"],
:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#08110F}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .seg button[aria-pressed="true"]{color:#fff}}
.search{max-width:210px}

footer.foot{
  margin-top:36px;padding-top:16px;border-top:1px solid var(--line);
  display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);align-items:center;
}

@media (max-width:860px){
  .kpis{grid-template-columns:1fr 1fr}
  .kpi:nth-child(3){border-left:0}
  .kpi:nth-child(n+3){border-top:1px solid var(--line)}
  .two{grid-template-columns:1fr !important}
  .form2{grid-template-columns:1fr}
  .hero-figure{align-items:flex-start}
  .brand h1{font-size:20px}
  .barrow{grid-template-columns:104px 1fr 66px}
}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <h1>Carnet de Cote</h1>
      <span class="sub" id="brandsub">Trade Republic &middot; Boursorama</span>
    </div>
    <div class="hero-figure">
      <span class="v num" id="heroVal">—</span>
      <span class="d" id="heroDelta">&nbsp;</span>
    </div>
    <div class="topactions">
      <button class="btn primary" id="btnImportTR" title="Rejouer l'export de transactions Trade Republic">Import Trade Republic</button>
      <button class="btn" id="btnGF" title="Coller la page Google Finance pour actualiser les cours">Actualiser les cours</button>
      <button class="btn" id="btnSnap" title="Figer la valeur du jour dans l'historique">Point du jour</button>
      <button class="btn ghost" id="btnTheme" title="Thème clair / sombre" aria-label="Basculer le thème clair ou sombre">Thème</button>
    </div>
  </div>
  <div class="topbar-in" style="padding-top:0;padding-bottom:0">
    <nav class="views" id="nav">
      <button data-v="synth" aria-current="true">Synthèse</button>
      <button data-v="pf">Portefeuilles</button>
      <button data-v="real">Gains encaissés</button>
      <button data-v="journal">Journal</button>
      <button data-v="wl">Prix conseillés</button>
      <button data-v="alloc">Allocation &amp; risque</button>
      <button data-v="hist">Historique</button>
      <button data-v="param">Paramètres</button>
    </nav>
  </div>
</div>

<div class="app">
  <div id="view"></div>
  <footer class="foot">
    <span id="syncState">Stockage local</span>
    <span>·</span>
    <span id="liveFoot"></span>
    <span>·</span>
    <span id="fxFoot"></span>
    <span>·</span>
    <span id="cntFoot"></span>
    <span>·</span>
    <span id="verFoot" title="version de la page — utile si l'affichage semble figé"></span>
    <span style="margin-left:auto"><button class="btn ghost sm" id="btnExport">Exporter en CSV</button></span>
  </footer>
</div>

<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>
<div id="modalRoot"></div>

<script>
"use strict";

/* ================================================================
   1. DONNÉES DE DÉPART — importées du Google Sheet « BOURSE »,
      feuille de consolidation (col. A-D, F-H + quantités).
   ================================================================ */

const SECTORS = {
  NVDA:"Semi-conducteurs", AMD:"Semi-conducteurs", INTC:"Semi-conducteurs",
  QCOM:"Semi-conducteurs", ARM:"Semi-conducteurs", AVGO:"Semi-conducteurs", MU:"Semi-conducteurs",
  MSFT:"Logiciel & IA", PLTR:"Logiciel & IA", SMCI:"Logiciel & IA",
  GOOGL:"Internet", META:"Internet", TCEHY:"Internet",
  BYDDF:"Automobile", XPEV:"Automobile", CATL:"Automobile", P911:"Automobile", TSLA:"Automobile",

const SECTOR_ORDER = ["Semi-conducteurs","Logiciel & IA","Internet","Automobile","Tech grand public","Réseau & infra","Espace","ETF","Indice","Autre"];
const CVARS = ["--c1","--c2","--c3","--c4","--c5","--c6","--c7","--c8"];

/* Watchlist : colonnes A, B, C, D, F, G, H de la feuille de consolidation */
const SEED_WL = [

].map(r=>({name:r[0],tk:r[1],recoEur:r[2],recoUsd:r[3],pxUsd:r[4],pxEur:r[5]}));

/* Fusionne l'historique par date plutôt que de le remplacer : un relevé
   enregistré ici ne peut plus être effacé par une version reçue d'ailleurs.
   À date égale, le point le plus récemment écrit gagne. */
function mergeHistory(a, b){
  const m = new Map();
  (a||[]).forEach(p=>{ if(p && p.d) m.set(p.d, p); });
  (b||[]).forEach(p=>{ if(p && p.d) m.set(p.d, p); });
  return degeler([...m.values()]).sort((x,y)=> x.d<y.d ? -1 : (x.d>y.d ? 1 : 0));
}

/* Prépare un état reçu (stockage local ou base distante) pour l'affichage.
   Les données saisies par Éric survivent aux mises à jour de la page :
   on part du modèle, on applique ce qui est stocké, et on ne retombe sur
   le contenu d'origine que pour les rubriques réellement absentes. */
/* Ce que la base de données renvoie est GELÉ : ses objets et ses tableaux
   sont en lecture seule. Sans copie profonde, la première écriture d'un
   cours lève « Cannot assign to read only property » — et, avant que la
   page ne rapporte ses erreurs, elle échouait en silence. On recopie donc
   tout ce qui entre, d'où qu'il vienne, avant de le confier à l'état. */
function degeler(x){
  try{ return x==null ? x : JSON.parse(JSON.stringify(x)); }
  catch(e){ return x; }
}

function normalize(d, base){
  const seed = JSON.parse(JSON.stringify(DEFAULT_STATE));
  if(!d || typeof d !== "object") return seed;
  d = degeler(d);
  const out = Object.assign({}, seed, d);   /* jamais sur `seed` : il reste la référence */
  ["positions","watchlist","realised","txn","flags"].forEach(k=>{
    if(!Array.isArray(d[k]) || !d[k].length) out[k] = seed[k];
  });
  out.history = mergeHistory(base && base.history, d.history);
  if(!out.history.length) out.history = seed.history;
  out.v = DEFAULT_STATE.v;
  return out;
}

const APP_VERSION = "13-web";   /* affiché en pied de page */
const LS_KEY = "carnet-de-cote-v1";
let S = null;          // état courant
let DB = null;         // capacité db (sync multi-appareils)
let SAMPLE = null;     // capacité sample (analyse de collage)
let DL = null;         // capacité downloads (enregistrement de fichier)
let saveTimer = null;
let pending = 0;        // écritures locales pas encore confirmées par la base
let lastSaved = null;   // horodatage de la dernière écriture confirmée

function loadLocal(){
  try{ const raw = localStorage.getItem(LS_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return null;
}
function saveLocal(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
}

/* `now` force l'écriture immédiate : un geste délibéré d'Éric — enregistrer
   un point du jour, importer un relevé — ne doit pas attendre un délai
   pendant lequel une version reçue d'ailleurs pourrait le recouvrir. */
function save(now){
  saveLocal();
  pending++;
  clearTimeout(saveTimer);
  const write = ()=>{
    if(!DB){ pending = 0; return; }
    const mine = pending;
    setSync("Enregistrement…");
    DB.doc("portfolio/state").set(JSON.parse(JSON.stringify(S)))
      .then(()=>{
        pending = Math.max(0, pending - mine);
        lastSaved = new Date();
        if(!pending) setSync("Enregistré · synchronisé sur tous tes appareils");
      })
      .catch(()=>{ pending = 0; setSync("Hors ligne — enregistré sur cet appareil"); });
  };
  if(now) write(); else saveTimer = setTimeout(write, 700);
}
function setSync(t){ const el=document.getElementById("syncState"); if(el) el.textContent=t; }

/* ================================================================
   3. CALCUL
   ================================================================ */
const PALIERS = [20,50,100,200];

function px(tk){
  const w = S.watchlist.find(x=>x.tk===tk);
  return w || null;
}
function priceEur(tk,cur){
  const w = px(tk);
  if(!w) return 0;
  /* une seule source de vérité par ligne : le cours dans sa devise de cotation,
     converti au taux courant — pas de valeur euro stockée qui dériverait. */
  if(cur==="EUR") return w.pxEur || 0;
  return (w.pxUsd||0)*S.fx;
}
function priceNative(tk,cur){
  const w = px(tk); if(!w) return 0;
  return cur==="EUR" ? (w.pxEur||0) : (w.pxUsd||0);
}
/* Chez Trade Republic les ordres se règlent en euros : le prix de revient
   est déjà en euros, frais d'ordre compris. Rien à convertir. */
function pruEur(p){ return p.pru; }

function computed(){
  const rows = S.positions.map(p=>{
    const pn   = priceNative(p.tk,p.cur);
    const pe   = priceEur(p.tk,p.cur);
    const val  = p.qty*pe;
    const cost = p.qty*pruEur(p);
    const pl   = val-cost;
    const perf = cost>0 ? pl/cost*100 : 0;
    const w    = px(p.tk);
    const reco = w ? (p.cur==="EUR" ? w.recoEur : w.recoUsd) : 0;
    let palier = 0;
    for(const t of PALIERS) if(perf>=t) palier=t;
    /* ordre limite de vente : distance du cours à la cible */
    let ordreGap = null, ordreState = null;
    if(p.ordre>0 && pn>0){
      ordreGap = (pn/p.ordre-1)*100;
      ordreState = ordreGap>=0 ? "atteint" : (ordreGap>=-5 ? "proche" : "loin");
    }
    return {...p, pn, pe, val, cost, pl, perf, reco, ordreGap, ordreState,
            ordreVal: p.ordre>0 ? (p.ordreQty||p.qty)*p.ordre*(p.cur==="EUR"?1:S.fx) : 0,
            sector:SECTORS[p.tk]||"Autre", palier,
            underReco: reco>0 && pn>0 && pn<reco};
  });
  const total = rows.reduce((a,r)=>a+r.val,0);
  rows.forEach(r=> r.weight = total>0 ? r.val/total*100 : 0);
  const cost  = rows.reduce((a,r)=>a+r.cost,0);
  const byAcct = {};
  for(const k in ACCOUNTS) byAcct[k]={val:0,cost:0,n:0};
  rows.forEach(r=>{ const b=byAcct[r.acct]||(byAcct[r.acct]={val:0,cost:0,n:0}); b.val+=r.val; b.cost+=r.cost; b.n++; });
  const realised = (S.realised||[]).reduce((a,r)=>a+r.gainEur,0);
  const proceeds = (S.realised||[]).reduce((a,r)=>a+r.prodEur,0);
  const inc = S.income||{};
  const revenus = (inc.dividendes||0)+(inc.interets||0);
  return {rows,total,cost,pl:total-cost,perf:cost>0?(total-cost)/cost*100:0,byAcct,
          realised, proceeds, revenus, inc, net:(total-cost)+realised+revenus};
}

const nfEur = new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:0});
const nfEur2= new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",minimumFractionDigits:2,maximumFractionDigits:2});
const nfNum = new Intl.NumberFormat("fr-FR",{maximumFractionDigits:2});
function eur(v,dec){ return (dec?nfEur2:nfEur).format(v||0); }
const nfPx = new Intl.NumberFormat("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2});
const nfFx = new Intl.NumberFormat("fr-FR",{minimumFractionDigits:4,maximumFractionDigits:5});
function money(v,cur){ return nfPx.format(v||0)+" "+(cur==="EUR"?"€":"$"); }
function pct(v,d){ const n=(v||0); return (n>0?"+":"")+n.toFixed(d===undefined?1:d)+" %"; }
function sgn(v){ return v>0?"pos":(v<0?"neg":""); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function today(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function frDate(iso){ if(!iso) return "—"; const [y,m,d]=iso.split("-"); return d+"/"+m+"/"+y; }
function cvar(i){ return "var("+CVARS[i%CVARS.length]+")"; }

function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("on");
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("on"),2600);
}

/* ================================================================
   5. GRAPHIQUES (SVG, une seule échelle, tokens de thème)
   ================================================================ */
function lineChart(points, opts){
  /* points: [{d:"YYYY-MM-DD", total, tr, pea}] */
  const W=760, H=230, mL=54, mR=14, mT=14, mB=26;
  if(points.length<2){
    const p0 = points[0];
    return '<div class="empty">'+(p0
      ? 'Un seul repère pour l\'instant : <b>'+eur(p0.total)+'</b> au '+frDate(p0.d)+
        '. Clique sur <b>Point du jour</b> pour ajouter le deuxième et voir la courbe apparaître.'
      : 'Aucun repère. Clique sur <b>Point du jour</b> pour figer la valeur d\'aujourd\'hui.')+'</div>';
  }
  const vals = points.map(p=>p.total);
  let lo=Math.min(...vals), hi=Math.max(...vals);
  const pad=(hi-lo)*0.12 || Math.max(hi*0.05,1);
  lo=Math.max(0,lo-pad); hi=hi+pad;
  const x=i=> mL + i*(W-mL-mR)/(points.length-1);
  const y=v=> mT + (1-(v-lo)/(hi-lo||1))*(H-mT-mB);
  const d = points.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(p.total).toFixed(1)).join(" ");
  const area = d+" L"+x(points.length-1).toFixed(1)+" "+(H-mB)+" L"+mL+" "+(H-mB)+" Z";
  const ticks=4, tk=[];
  for(let i=0;i<=ticks;i++){ const v=lo+(hi-lo)*i/ticks; tk.push({v,y:y(v)}); }
  const labIdx = points.length<=6 ? points.map((_,i)=>i)
                : [0, Math.round((points.length-1)/2), points.length-1];
  const last = points[points.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:230px" id="histSvg">
    <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--accent)" stop-opacity=".22"/>
      <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
    </linearGradient></defs>
    ${tk.map(t=>`<line class="gridline" x1="${mL}" x2="${W-mR}" y1="${t.y.toFixed(1)}" y2="${t.y.toFixed(1)}"/>
      <text x="${mL-8}" y="${(t.y+3).toFixed(1)}" text-anchor="end">${Math.round(t.v/1000)}k</text>`).join("")}
    <path d="${area}" fill="url(#ga)"/>
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(points.length-1).toFixed(1)}" cy="${y(last.total).toFixed(1)}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
    ${labIdx.map(i=>`<text x="${x(i).toFixed(1)}" y="${H-8}" text-anchor="${i===0?'start':(i===points.length-1?'end':'middle')}">${frDate(points[i].d).slice(0,5)}</text>`).join("")}
    ${points.map((p,i)=>`<rect x="${(x(i)-8).toFixed(1)}" y="${mT}" width="16" height="${H-mT-mB}" fill="transparent" data-hi="${i}"/>`).join("")}
  </svg>`;
}

function divergingBars(items){
  /* items: [{label, tk, v}] v en % */
  if(!items.length) return '<div class="empty">Aucune ligne.</div>';
  const max = Math.max(...items.map(i=>Math.abs(i.v)),1);
  return '<div class="barlist">'+items.map(i=>{
    const w = Math.abs(i.v)/max*50;
    const neg = i.v<0;
    return `<div class="barrow">
      <span class="lbl"><span class="tick">${esc(i.tk)}</span> ${esc(i.label)}</span>
      <span class="bartrack">
        <span style="position:absolute;left:50%;top:-1px;bottom:-1px;width:1px;background:var(--line-strong)"></span>
        <span class="barfill" style="${neg?`right:50%;width:${w}%;background:var(--loss)`:`left:50%;width:${w}%;background:var(--gain)`}"></span>
      </span>
      <span class="val ${sgn(i.v)}">${pct(i.v)}</span>
    </div>`;
  }).join("")+'</div>';
}

function stackedBar(groups, totalVal){
  /* groups: [{label, val}] déjà triés. Au-delà de huit teintes, les
     couleurs cesseraient d'identifier quoi que ce soit : le reste est regroupé. */
  if(!groups.length || totalVal<=0) return '<div class="empty">Aucune donnée.</div>';
  if(groups.length > 8){
    const head = groups.slice(0,7);
    const rest = groups.slice(7).reduce((a,g)=>a+g.val,0);
    groups = head.concat([{label:"Autres ("+(groups.length-7)+")", val:rest}]);
  }
  const bar = groups.map((g,i)=>`<span title="${esc(g.label)}" style="width:${(g.val/totalVal*100).toFixed(2)}%;background:${cvar(i)}"></span>`).join("");
  const leg = groups.map((g,i)=>`<span class="li"><span class="dot" style="background:${cvar(i)}"></span>${esc(g.label)} <span class="n">${(g.val/totalVal*100).toFixed(1)} %</span></span>`).join("");
  return `<div class="stack">${bar}</div><div class="legend">${leg}</div>`;
}

    <b style="color:var(--ink)">Perf. titre</b> compare le cours au prix de revient dans la devise de cotation : c'est la performance de ton choix de valeur.
    <b style="color:var(--ink)">Perf. €</b> ajoute l'effet de change, en convertissant chaque achat au taux du mois où il a été passé — c'est ce que la ligne a réellement rapporté ou coûté en euros.
    Les quantités et prix de revient s'éditent dans le tableau ; tout se recalcule à la sortie du champ.
  </p>`;
}

/* ---------- GAINS ENCAISSÉS ---------- */
function vReal(C){
  const R = [...(S.realised||[])].sort((a,b)=>b.gainEur-a.gainEur);
  const win = R.filter(r=>r.gainEur>0), lose = R.filter(r=>r.gainEur<=0);
  const best = R[0];
  const soldOut = R.filter(r=>!S.positions.find(p=>p.tk===r.tk && p.acct===r.acct));
  return `
  <div class="section kpis">
    <div class="kpi"><div class="k">Plus-values encaissées</div><div class="v ${sgn(C.realised)}">${(C.realised>=0?"+":"")+eur(C.realised)}</div>
      <div class="m">sur ${eur(C.proceeds)} de ventes</div></div>
    <div class="kpi"><div class="k">Lignes gagnantes</div><div class="v">${win.length} <span style="font-size:14px;color:var(--muted)">/ ${R.length}</span></div>
      <div class="m">${lose.length? lose.length+" vendue"+(lose.length>1?"s":"")+" à perte" : "aucune vente à perte"}</div></div>
    <div class="kpi"><div class="k">Meilleur arbitrage</div><div class="v">${best?esc(best.tk):"—"}</div>
      <div class="m">${best? (best.gainEur>=0?"+":"")+eur(best.gainEur)+" sur "+best.qty+" titres" : ""}</div></div>
    <div class="kpi"><div class="k">Lignes soldées</div><div class="v">${soldOut.length}</div>
      <div class="m">${soldOut.length? soldOut.map(r=>r.tk).join(" · ") : "toutes encore détenues"}</div></div>
  </div>

  <div class="callout a section">
    <span>€</span><div>Chaque vente est valorisée au taux de change du mois où elle a été passée, et comparée au prix de revient moyen
    des titres à cet instant. Le total ci-dessous est un <b>résultat encaissé</b> : il est acquis, quoi que fassent les cours ensuite.</div>
  </div>

  <div class="panel section">
    <div class="panel-head"><h2>Ce que chaque ligne a rapporté</h2>
      <span class="note">${R.length} valeurs vendues, en tout ou partie</span></div>
    <div class="tablewrap"><table>
      <thead><tr><th class="l">Valeur</th><th class="l">Compte</th><th>Titres vendus</th><th>Produit des ventes</th>
        <th>PV encaissée</th><th>Part du gain</th><th class="l">Statut</th></tr></thead>
      <tbody>${R.map(r=>{
        const share = C.realised>0 ? r.gainEur/C.realised*100 : 0;
        const held = S.positions.find(p=>p.tk===r.tk && p.acct===r.acct);
        return `<tr class="sev-${r.gainEur>0?"g":"r"}">
          <td class="l"><div class="cell-name"><span class="nm">${esc(r.name)}</span><span class="tick">${esc(r.tk)}</span></div></td>
          <td class="l"><span class="acct">${ACCOUNTS[r.acct]?ACCOUNTS[r.acct].short:"—"}</span></td>
          <td class="mono">${nfNum.format(r.qty)}</td>
          <td class="mono">${eur(r.prodEur)}</td>
          <td class="mono ${sgn(r.gainEur)}">${(r.gainEur>=0?"+":"")+eur(r.gainEur)}</td>
          <td class="mono">${share.toFixed(1)} %</td>
          <td class="l">${held?'<span class="pill a">encore détenue</span>':'<span class="pill n">soldée</span>'}</td>
        </tr>`;}).join("")}</tbody>
      <tfoot><tr><td class="l"><b>Total encaissé</b></td><td></td><td></td>
        <td class="mono"><b>${eur(C.proceeds)}</b></td>
        <td class="mono ${sgn(C.realised)}"><b>${(C.realised>=0?"+":"")+eur(C.realised)}</b></td><td></td><td></td></tr></tfoot>
    </table></div>
  </div>

  ${C.inc && (C.inc.dividendes||C.inc.interets)? `<div class="panel section">
    <div class="panel-head"><h2>Revenus hors plus-values</h2><span class="note">relevés dans l'export Trade Republic</span></div>
    <div class="tablewrap"><table style="min-width:520px"><tbody>
      <tr><td class="l">Dividendes nets de retenue</td><td class="mono pos">${(C.inc.dividendes>=0?"+":"")+eur(C.inc.dividendes,1)}</td>
        <td class="l" style="color:var(--muted);font-size:12px">Qualcomm en verse l'essentiel</td></tr>
      <tr><td class="l">Intérêts sur les liquidités</td><td class="mono pos">${(C.inc.interets>=0?"+":"")+eur(C.inc.interets,1)}</td>
        <td class="l" style="color:var(--muted);font-size:12px">rémunération du cash non investi</td></tr>
      <tr><td class="l">Frais d'ordre payés</td><td class="mono neg">-${eur(C.inc.frais,1)}</td>
        <td class="l" style="color:var(--muted);font-size:12px">1 € par ordre, déjà déduits des calculs</td></tr>
      <tr><td class="l">Versements sur le compte</td><td class="mono">${eur(C.inc.versements)}</td>
        <td class="l" style="color:var(--muted);font-size:12px">argent apporté depuis ta banque</td></tr>
    </tbody></table></div></div>`:""}

  <div class="panel section">
    <div class="panel-head"><h2>Poids de chaque arbitrage</h2><span class="note">en euros encaissés</span></div>
    <div style="padding:0 16px 18px">
      ${stackedBar(R.filter(r=>r.gainEur>0).map(r=>({label:r.tk,val:r.gainEur})),
                   R.filter(r=>r.gainEur>0).reduce((a,r)=>a+r.gainEur,0))}
    </div>
  </div>

  ${(S.flags&&S.flags.length)? `<div class="eyebrow">Points à trancher dans le journal</div>
  <div class="panel"><div style="padding:14px 16px;display:flex;flex-direction:column;gap:12px">
    ${S.flags.map(f=>`<div style="display:flex;gap:11px;align-items:flex-start;font-size:12.5px;line-height:1.55">
      <span class="tick" style="min-width:52px;padding-top:2px">${esc(f.tk)}</span>
      <span style="color:var(--ink-2)">${esc(f.txt)}</span></div>`).join("")}
  </div></div>`:""}`;
}

/* ---------- JOURNAL ---------- */
let jType = "ALL", jYear = "ALL";

function vJournal(C){
  const all = S.txn || [];
  if(!all.length) return '<div class="panel section"><div class="empty">Aucune opération enregistrée. Utilise <b>Import Trade Republic</b> pour charger ton journal.</div></div>';

  const years = [...new Set(all.map(t=>t.d.slice(0,4)))].sort().reverse();
  let T = all;
  if(filterAcct!=="ALL") T = T.filter(t=>t.acct===filterAcct);
  if(jType!=="ALL")      T = T.filter(t=>t.type===jType);
  if(jYear!=="ALL")      T = T.filter(t=>t.d.slice(0,4)===jYear);
  if(filterText){
    const q=filterText.toLowerCase();
    T = T.filter(t=>t.tk.toLowerCase().includes(q) || (TXN_LABEL[t.type]||"").toLowerCase().includes(q));
  }
  T = [...T].sort((a,b)=> a.d<b.d ? 1 : (a.d>b.d ? -1 : 0));

  const sum = ty => all.filter(t=>t.type===ty).reduce((a,t)=>a+t.amt,0);
  const achats = sum("A"), ventes = sum("V"), divs = sum("D");
  const nOps = all.filter(t=>t.type==="A"||t.type==="V").length;

  /* activité par trimestre : volume acheté et vendu, une seule échelle */
  const q = {};
  all.filter(t=>t.type==="A"||t.type==="V").forEach(t=>{
    const k = t.d.slice(0,4)+"-T"+(Math.floor(+t.d.slice(5,7)/3.01)+1);
    const c = q[k] || (q[k]={a:0,v:0});
    if(t.type==="A") c.a+=t.amt; else c.v+=t.amt;
  });
  const keys = Object.keys(q).sort();
  const peak = Math.max(...keys.map(k=>Math.max(q[k].a,q[k].v)),1);

  return `
  <div class="section kpis">
    <div class="kpi"><div class="k">Opérations de bourse</div><div class="v">${nOps}</div>
      <div class="m">${all.filter(t=>t.type==="A").length} achats · ${all.filter(t=>t.type==="V").length} ventes</div></div>
    <div class="kpi"><div class="k">Total investi</div><div class="v">${eur(achats)}</div>
      <div class="m">frais d'ordre compris</div></div>
    <div class="kpi"><div class="k">Total désinvesti</div><div class="v">${eur(ventes)}</div>
      <div class="m">net de frais et de taxes</div></div>
    <div class="kpi"><div class="k">Première opération</div><div class="v" style="font-size:17px">${frDate(all.map(t=>t.d).sort()[0])}</div>
      <div class="m">dernière le ${frDate(all.map(t=>t.d).sort().reverse()[0])}</div></div>
  </div>

  <div class="panel section">
    <div class="panel-head"><h2>Rythme d'activité</h2>
      <span class="note">montants engagés par trimestre, en euros</span></div>
    <div style="padding:0 16px 18px">
      <div class="legend" style="margin:0 0 12px">
        <span class="li"><span class="dot" style="background:var(--c1)"></span>Achats</span>
        <span class="li"><span class="dot" style="background:var(--c2)"></span>Ventes</span>
      </div>
      <div class="barlist">
        ${keys.map(k=>`<div class="barrow" style="grid-template-columns:70px 1fr 96px">
          <span class="lbl mono" style="font-family:'IBM Plex Mono',monospace;font-size:11.5px">${k}</span>
          <span style="display:flex;flex-direction:column;gap:3px">
            <span class="bartrack" style="height:8px"><span class="barfill" style="left:0;width:${(q[k].a/peak*100).toFixed(1)}%;background:var(--c1)"></span></span>
            <span class="bartrack" style="height:8px"><span class="barfill" style="left:0;width:${(q[k].v/peak*100).toFixed(1)}%;background:var(--c2)"></span></span>
          </span>
          <span class="val" style="line-height:1.35"><span style="color:var(--c1)">${eur(q[k].a)}</span><br><span style="color:var(--c2)">${q[k].v? eur(q[k].v) : "—"}</span></span>
        </div>`).join("")}
      </div>
    </div>
  </div>

  <div class="section filters">
    <div class="seg" id="acctSeg">
      <button data-a="ALL" aria-pressed="${filterAcct==="ALL"}">Tout</button>
      ${Object.keys(ACCOUNTS).map(k=>`<button data-a="${k}" aria-pressed="${filterAcct===k}">${ACCOUNTS[k].label}</button>`).join("")}
    </div>
    <div class="seg" id="typeSeg">
      <button data-t="ALL" aria-pressed="${jType==="ALL"}">Tous mouvements</button>
      ${["A","V","D","G"].map(t=>`<button data-t="${t}" aria-pressed="${jType===t}">${TXN_PLURAL[t]}</button>`).join("")}
    </div>
    <select id="yearSel" style="max-width:120px">
      <option value="ALL"${jYear==="ALL"?" selected":""}>Toutes années</option>
      ${years.map(y=>`<option value="${y}"${jYear===y?" selected":""}>${y}</option>`).join("")}
    </select>
    <input type="text" class="search" id="q" placeholder="Filtrer un ticker…" value="${esc(filterText)}">
  </div>

  <div class="panel">
    <div class="panel-head"><h2>Journal des opérations</h2>
      <span class="note">${T.length} ligne${T.length>1?"s":""} affichée${T.length>1?"s":""} sur ${all.length}</span></div>
    <div class="tablewrap"><table style="min-width:760px">
      <thead><tr><th class="l">Date</th><th class="l">Compte</th><th class="l">Valeur</th>
        <th class="l">Mouvement</th><th>Titres</th><th>Prix unitaire</th><th>Montant</th></tr></thead>
      <tbody>${T.length? T.map(t=>{
        const pos = S.positions.find(p=>p.tk===t.tk);
        return `<tr>
        <td class="l mono">${frDate(t.d)}</td>
        <td class="l"><span class="acct">${ACCOUNTS[t.acct]?ACCOUNTS[t.acct].short:t.acct}</span></td>
        <td class="l"><span class="tick">${esc(t.tk)}</span>${pos?"":' <span style="color:var(--muted);font-size:11px">soldée</span>'}</td>
        <td class="l"><span class="pill ${t.type==="A"?"n":(t.type==="V"?"a":"g")}">${TXN_LABEL[t.type]}</span></td>
        <td class="mono">${t.qty? nfNum.format(t.qty) : "—"}</td>
        <td class="mono">${t.px? nfPx.format(t.px)+" €" : "—"}</td>
        <td class="mono ${t.type==="A"?"":"pos"}">${t.amt? (t.type==="A"?"−":"+")+eur(t.amt,1) : "—"}</td>
      </tr>`;}).join("")
      : '<tr><td colspan="7"><div class="empty">Aucun mouvement ne correspond aux filtres.</div></td></tr>'}</tbody>
    </table></div>
  </div>

  <p style="font-size:12px;color:var(--muted);margin:12px 2px;max-width:74ch;line-height:1.6">
    C'est ce journal qui produit tous les chiffres de la page : les prix de revient sont recalculés
    opération par opération, en prix moyen pondéré. Les montants sont nets — le frais d'ordre de 1 €
    est ajouté aux achats et retiré des ventes, et les retenues à la source sont déduites des dividendes.
    ${divs? "Les dividendes totalisent "+eur(divs,1)+" nets." : ""}
    Les transferts de garde de février 2025, à quantité inchangée et sans montant, ne sont pas affichés.
  </p>`;
}

/* ---------- PRIX CONSEILLÉS ---------- */
function vWl(C){
  let rows = S.watchlist.map(w=>{
    const ratio = w.recoUsd>0 ? w.pxUsd/w.recoUsd : 0;
    const held  = S.positions.find(p=>p.tk===w.tk);
    return {...w, ratio, ecart:(ratio-1)*100, held:!!held,
            sector:SECTORS[w.tk]||"Autre"};
  });
  if(filterText){
    const q=filterText.toLowerCase();
    rows = rows.filter(r=>r.name.toLowerCase().includes(q)||r.tk.toLowerCase().includes(q));
  }
  rows.sort((a,b)=>a.ecart-b.ecart);

  return `
  <div class="section callout a">
    <span>↺</span><div>Ta colonne H du Sheet affiche un <b>rapport</b> (203 % = le cours vaut 2,03 fois le prix conseillé), pas un gain.
    Ici les deux sont séparés : le <b>multiple</b> ×2,03 et l'<b>écart réel</b> +103 %. Trié du moins cher au plus cher par rapport à ta cible.</div>
  </div>

  <div class="section filters">
    <input type="text" class="search" id="q" placeholder="Filtrer une valeur…" value="${esc(filterText)}">
    <span class="pill n">${rows.filter(r=>r.ecart<=5).length} sous ou proche de la cible</span>
    <span style="margin-left:auto"><button class="btn sm" id="btnEditPx">Mettre les cours à jour</button></span>
  </div>

  <div class="panel">
    <div class="panel-head"><h2>Valeurs suivies et prix d'achat conseillés</h2>
      <span class="note">cours du ${frDate(S.pxDate)}</span></div>
    <div class="tablewrap">
      <table>
        <thead><tr>
          <th class="l">Valeur</th><th class="l">Poche</th>
          <th>Conseillé €</th><th>Conseillé $</th><th>Cours $</th><th>Cours €</th>
          <th>Multiple</th><th>Écart à la cible</th><th class="l">Détenue</th>
        </tr></thead>
        <tbody>${rows.map(r=>`<tr class="${r.ecart<=0?"sev-g":(r.ecart<=5?"sev-w":"")}">
          <td class="l"><div class="cell-name"><span class="nm">${esc(r.name)}</span><span class="tick">${esc(r.tk)}</span></div></td>
          <td class="l"><span class="acct">${r.sector}</span></td>
          <td class="mono">${nfNum.format(r.recoEur)}</td>
          <td class="mono">${nfNum.format(r.recoUsd)}</td>
          <td class="mono">${nfNum.format(r.pxUsd)}</td>
          <td class="mono">${nfNum.format(r.pxEur)}</td>
          <td class="mono">×${r.ratio.toFixed(2)}</td>
          <td class="mono ${r.ecart<=0?"pos":""}">${pct(r.ecart,0)}</td>
          <td class="l">${r.held?'<span class="pill a">en portefeuille</span>':'<span class="pill n">suivi</span>'}</td>
        </tr>`).join("")}</tbody>
      </table>
    </div>
  </div>`;
}

/* ---------- ALLOCATION ---------- */
function sectorGroups(C){
  const m={};
  C.rows.forEach(r=>{ m[r.sector]=(m[r.sector]||0)+r.val; });
  return SECTOR_ORDER.filter(s=>m[s]).map(s=>({label:s,val:m[s]}));
}
function vAlloc(C){
  const sectors = sectorGroups(C);
  const accts = Object.keys(C.byAcct).filter(k=>C.byAcct[k].n)
                 .map(k=>({label:ACCOUNTS[k].label,val:C.byAcct[k].val}));
  const cur={};
  C.rows.forEach(r=>{ const k=r.cur==="EUR"?"Zone euro (EUR)":"Dollar (USD)"; cur[k]=(cur[k]||0)+r.val; });
  const curs = Object.keys(cur).map(k=>({label:k,val:cur[k]}));
  const top = [...C.rows].sort((a,b)=>b.val-a.val);
  const hhi = C.total>0 ? C.rows.reduce((a,r)=>a+Math.pow(r.val/C.total*100,2),0) : 0;
  const top3 = top.slice(0,3).reduce((a,r)=>a+r.weight,0);
  const usdShare = C.total>0 ? (cur["Dollar (USD)"]||0)/C.total*100 : 0;
  const risk = hhi>2500?["Très concentré","r"]:(hhi>1500?["Concentré","w"]:["Diversifié","g"]);

  return `
  <div class="section kpis">
    <div class="kpi"><div class="k">Concentration (HHI)</div><div class="v">${Math.round(hhi)}</div>
      <div class="m"><span class="pill ${risk[1]}">${risk[0]}</span></div></div>
    <div class="kpi"><div class="k">Poids des 3 premières</div><div class="v">${top3.toFixed(0)} %</div>
      <div class="m">${top.slice(0,3).map(r=>r.tk).join(" · ")}</div></div>
    <div class="kpi"><div class="k">Exposition dollar</div><div class="v">${usdShare.toFixed(0)} %</div>
      <div class="m">le reste est libellé en euro</div></div>
    <div class="kpi"><div class="k">Nombre de poches</div><div class="v">${sectors.length}</div>
      <div class="m">${C.rows.length} lignes réparties</div></div>
  </div>

  <div class="section grid two" style="grid-template-columns:1fr 1fr">
    <div class="panel"><div class="panel-head"><h2>Par secteur</h2></div>
      <div style="padding:0 16px 18px">${stackedBar(sectors,C.total)}</div></div>
    <div class="panel"><div class="panel-head"><h2>Par compte</h2></div>
      <div style="padding:0 16px 18px">${stackedBar(accts,C.total)}</div></div>
  </div>

  <div class="section grid two" style="grid-template-columns:1fr 1fr">
    <div class="panel"><div class="panel-head"><h2>Par devise</h2><span class="note">risque de change</span></div>
      <div style="padding:0 16px 18px">${stackedBar(curs,C.total)}
      <p style="font-size:12.5px;color:var(--muted);margin:14px 0 0;line-height:1.55">
        Une baisse de 10 % du dollar face à l'euro coûterait environ
        <b style="color:var(--ink)">${eur((cur["Dollar (USD)"]||0)*0.10)}</b> à valeur d'action constante.</p></div></div>
    <div class="panel"><div class="panel-head"><h2>Poids des lignes</h2><span class="note">top 10</span></div>
      <div style="padding:0 16px 18px"><div class="barlist">
        ${top.slice(0,10).map((r,i)=>`<div class="barrow">
          <span class="lbl"><span class="tick">${esc(r.tk)}</span> ${esc(r.name)}</span>
          <span class="bartrack"><span class="barfill" style="left:0;width:${(r.weight/(top[0].weight||1)*100).toFixed(1)}%;background:var(--accent)"></span></span>
          <span class="val">${r.weight.toFixed(1)} %</span></div>`).join("")}
      </div></div></div>
  </div>

  <div class="eyebrow">Performance ligne par ligne</div>
  <div class="panel">
    <div class="panel-head"><h2>Écart au prix de revient</h2><span class="note">dans la devise de cotation, effet de change exclu</span></div>
    <div style="padding:0 16px 18px">
    ${divergingBars([...C.rows].sort((a,b)=>b.perf-a.perf).map(r=>({tk:r.tk,label:r.name,v:r.perf})))}
  </div></div>`;
}

/* ---------- HISTORIQUE ---------- */
function vHist(C){
  const h=[...S.history].reverse();
  const peak = S.history.length? Math.max(...S.history.map(p=>p.total)) : 0;
  const first= S.history.length? S.history[0] : null;
  const since = first && first.total>0 ? (C.total/first.total-1)*100 : 0;
  return `
  <div class="section kpis">
    <div class="kpi"><div class="k">Valeur actuelle</div><div class="v">${eur(C.total)}</div><div class="m">au ${frDate(today())}</div></div>
    <div class="kpi"><div class="k">Record</div><div class="v">${peak?eur(peak):"—"}</div>
      <div class="m">${peak? (C.total>=peak?"atteint aujourd'hui":"soit "+pct((C.total/peak-1)*100)+" du sommet") : "aucun point enregistré"}</div></div>
    <div class="kpi"><div class="k">Depuis le 1ᵉʳ point</div><div class="v ${sgn(since)}">${first?pct(since):"—"}</div>
      <div class="m">${first?frDate(first.d):"—"}</div></div>
    <div class="kpi"><div class="k">Points enregistrés</div><div class="v">${S.history.length}</div>
      <div class="m">un clic sur « Point du jour »</div></div>
  </div>

  <div class="panel section">
    <div class="panel-head"><h2>Courbe de valeur</h2><span class="note">euros, tous comptes</span></div>
    <div style="padding:0 16px 16px">${lineChart(S.history)}</div>
  </div>

  <div class="panel section">
    <div class="panel-head"><h2>Relevés</h2>
      <span class="note"><button class="btn sm" id="btnSnap2">Enregistrer le point du jour</button></span></div>
    <div class="tablewrap"><table style="min-width:0">
      <thead><tr><th class="l">Date</th><th>Total</th><th>Trade Republic</th><th>Boursorama</th><th>Variation</th><th></th></tr></thead>
      <tbody>${h.length? h.map((p,i)=>{

function wire(){
  const el=document.getElementById("view");
  const nx=el.querySelector("#noticeX");
  if(nx) nx.onclick=()=>{ notice=null; render(); };

  el.querySelectorAll("th[data-sort]").forEach(th=>th.onclick=()=>{
    const k=th.dataset.sort;
    if(sortKey===k) sortDir=-sortDir; else {sortKey=k;sortDir=(k==="name"||k==="acct")?1:-1;}
    render();
  });

  const seg=el.querySelector("#acctSeg");
  if(seg) seg.querySelectorAll("button").forEach(b=>b.onclick=()=>{filterAcct=b.dataset.a;render();});

  const tseg=el.querySelector("#typeSeg");
  if(tseg) tseg.querySelectorAll("button").forEach(b=>b.onclick=()=>{jType=b.dataset.t;render();});
  const ysel=el.querySelector("#yearSel");
  if(ysel) ysel.onchange=()=>{jYear=ysel.value;render();};

  const q=el.querySelector("#q");
  if(q){
    q.oninput=()=>{ filterText=q.value; const c=q.selectionStart; render();
      const nq=document.getElementById("q"); if(nq){nq.focus(); nq.setSelectionRange(c,c);} };
  }

  el.querySelectorAll("tbody input[data-f]").forEach(inp=>{
    inp.onchange=()=>{
      const id=inp.closest("tr").dataset.id;
      const p=S.positions.find(x=>x.id===id); if(!p) return;
      const f=inp.dataset.f;
      const raw=String(inp.value).trim();
      if(raw===""){                       /* champ vidé : on retire l'ordre */
        if(f==="ordre"||f==="ordreQty"){ delete p[f]; delete p.ordreSrc; save(); render(); }
        else render();
        return;
      }
      const v=parseFloat(raw.replace(",","."));
      if(!isFinite(v)||v<0){ render(); return; }
      if(f==="ordre"||f==="ordreQty"){ p[f]=v; delete p.ordreSrc; save(); render(); return; }
      p[f]=v;
      if(inp.dataset.f==="pru") p.pruEur = p.cur==="EUR" ? v : v*S.fx;
      p.ok=true; save(); render();
    };
  });

  el.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    S.positions=S.positions.filter(p=>p.id!==b.dataset.del); save(); render(); toast("Ligne supprimée");
  });
  el.querySelectorAll("[data-delh]").forEach(b=>b.onclick=()=>{
    S.history=S.history.filter(p=>p.d!==b.dataset.delh); save(); render();
  });

  const add=el.querySelector("#btnAdd"); if(add) add.onclick=openAdd;
  const p2=el.querySelector("#btnImportTR2"); if(p2) p2.onclick=openImportTR;
  const s2=el.querySelector("#btnSnap2"); if(s2) s2.onclick=snapshot;
  const ep=el.querySelector("#btnEditPx"); if(ep) ep.onclick=openGF;

  const fx=el.querySelector("#fxIn");
  if(fx) fx.onchange=()=>{ const v=parseFloat(fx.value); if(v>0){S.fx=v;save();render();} };
  const pd=el.querySelector("#pxDateIn");
  if(pd) pd.onchange=()=>{ S.pxDate=pd.value; save(); render(); };

  const bp=el.querySelector("#btnParsePx"); if(bp) bp.onclick=parsePrices;
  const g2=el.querySelector("#btnGF2"); if(g2) g2.onclick=openGF;
  const cbk=el.querySelector("#btnCopyBk");
  if(cbk) cbk.onclick=()=>{
    try{ navigator.clipboard.writeText(GF_BOOKMARKLET);
         toast("Code copié — crée un favori et colle-le dans le champ adresse"); }
    catch(e){ toast("Copie refusée par le navigateur"); }
  };
  const bpf=el.querySelector("#btnPasteFull"); if(bpf) bpf.onclick=openPaste;
  const bit=el.querySelector("#btnImportTR3"); if(bit) bit.onclick=openImportTR;
  const be2=el.querySelector("#btnExport2"); if(be2) be2.onclick=exportCsv;
  const bm=el.querySelector("#btnMarkAll"); if(bm) bm.onclick=()=>{
    S.positions.forEach(p=>p.ok=true); save(); render(); toast("Toutes les lignes sont marquées vérifiées");
  };
  const br=el.querySelector("#btnReset"); if(br) br.onclick=()=>{
    if(!confirm("Remplacer les positions et la watchlist par les données du Google Sheet ? L'historique est conservé.")) return;
    const h=S.history; S={...JSON.parse(JSON.stringify(DEFAULT_STATE)),history:h}; save(); render(); toast("Données réinitialisées");
  };

  wireChartHover();
}

function setPrice(tk,v,cur){
  const w=S.watchlist.find(x=>x.tk===tk); if(!w||!(v>0)) return false;

  return true;
}

/* ================================================================
   IMPORT DE L'EXPORT TRADE REPUBLIC
   Le courtier exporte un CSV où tout est libellé en euros, frais et
   taxes compris. On rejoue le journal du début : c'est le seul calcul
   qui donne un prix de revient exact, et il ne dépend d'aucune IA.
   ================================================================ */

/* nom Trade Republic → [ticker, devise de cotation, nom d'affichage] */
const TR_MAP = {
  "AMD":["AMD","USD","AMD"],
  "ARM (ADR)":["ARM","USD","ARM Holdings"],
  "Xiaomi":["XIACF","USD","Xiaomi"],
  "Intel":["INTC","USD","Intel"],
  "Qualcomm":["QCOM","USD","Qualcomm"],
  "NVIDIA":["NVDA","USD","NVIDIA"],
  "BYD":["BYDDF","USD","BYD Company"],
  "Microsoft":["MSFT","USD","Microsoft"],
  "Apple":["AAPL","USD","Apple"],
  "Alphabet (A)":["GOOGL","USD","Alphabet"],
  "PEA NASDAQ 100 EUR (Acc)":["PUST","EUR","Amundi PEA Nasdaq-100"],
  "Palantir Technologies":["PLTR","USD","Palantir"],
  "Meta Platforms (A)":["META","USD","Meta Platforms"],
  "Super Micro Computer":["SMCI","USD","Super Micro Computer"],
  "Arista Networks":["ANET","USD","Arista Networks"],
  "Xpeng (ADR)":["XPEV","USD","Xpeng (ADR)"],
  "Contemporary Amperex Technolog":["CATL","EUR","CATL"],
  "Tencent Holdings":["TCEHY","USD","Tencent"],
  "SpaceX":["SPCX","USD","SpaceX (non coté)"]
};

/* Lecteur CSV tolérant aux guillemets et aux virgules dans les champs. */
function csvRows(text){
  const rows=[]; let row=[], cell="", q=false;
  const t = text.charCodeAt(0)===0xFEFF ? text.slice(1) : text;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){
      if(c==='"'){ if(t[i+1]==='"'){cell+='"';i++;} else q=false; }
      else cell+=c;
    } else if(c==='"') q=true;
    else if(c===","){ row.push(cell); cell=""; }
    else if(c==="\n"){ row.push(cell); rows.push(row); row=[]; cell=""; }
    else if(c!=="\r") cell+=c;
  }
  if(cell!==""||row.length){ row.push(cell); rows.push(row); }
  return rows;
}

function importTradeRepublic(text){
  const rows = csvRows(text);
  if(!rows.length) throw new Error("Fichier vide.");
  const head = rows[0].map(h=>h.trim());
  const need = ["datetime","date","category","type","name","shares","price","amount","fee","tax"];
  const idx = {};
  need.forEach(k=>{ idx[k]=head.indexOf(k); });
  if(idx.type<0 || idx.name<0 || idx.amount<0)
    throw new Error("Ce fichier n'a pas la structure d'un export Trade Republic.");

  const recs = rows.slice(1).filter(r=>r.length>=head.length-2)
    .map(r=>({ dt:r[idx.datetime]||"", date:r[idx.date]||"", cat:r[idx.category]||"",
               type:(r[idx.type]||"").trim(), name:(r[idx.name]||"").trim(),
               shares:num(r[idx.shares]), price:num(r[idx.price]),
               amount:num(r[idx.amount]), fee:num(r[idx.fee]), tax:num(r[idx.tax]) }))
    .sort((a,b)=> a.dt<b.dt?-1:(a.dt>b.dt?1:0));
  function num(v){ const n=parseFloat(String(v||"").trim()); return isFinite(n)?n:0; }

  const book={}, sells={}, unknown=new Set(), txn=[];
  let dividendes=0, interets=0, frais=0, versements=0, nOps=0, dLast="";
  const TK = nm => (TR_MAP[nm] ? TR_MAP[nm][0] : nm.toUpperCase().slice(0,6));

  for(const r of recs){
    const B = n => book[n] || (book[n]={qty:0,cost:0,bonus:0});
    if(r.type==="BUY"){
      const b=B(r.name); b.qty+=Math.abs(r.shares); b.cost+=Math.abs(r.amount)+Math.abs(r.fee);
      frais+=Math.abs(r.fee); nOps++; dLast=r.date||dLast;
      txn.push({d:r.date, acct:"TR", tk:TK(r.name), type:"A",
                qty:Math.abs(r.shares), px:r.price,
                amt:Math.round((Math.abs(r.amount)+Math.abs(r.fee))*100)/100});
      if(!TR_MAP[r.name]) unknown.add(r.name);
    } else if(r.type==="SELL"){
      const b=B(r.name); const q=Math.abs(r.shares);
      const pru = b.qty>0 ? b.cost/b.qty : 0;
      const net = Math.abs(r.amount)-Math.abs(r.fee)-Math.abs(r.tax);
      const s = sells[r.name] || (sells[r.name]={qty:0,prodEur:0,gainEur:0});
      s.qty+=q; s.prodEur+=net; s.gainEur += net - q*pru;
      b.qty-=q; b.cost-=q*pru;
      if(b.qty<1e-9){ b.qty=0; b.cost=0; }
      frais+=Math.abs(r.fee); nOps++; dLast=r.date||dLast;
      txn.push({d:r.date, acct:"TR", tk:TK(r.name), type:"V",
                qty:q, px:r.price, amt:Math.round(net*100)/100});
      if(!TR_MAP[r.name]) unknown.add(r.name);
    } else if(r.type==="BONUS_ISSUE" || r.type==="BONUS_ISSUE_CANCELLED"){
      const b=B(r.name); b.qty+=r.shares; b.bonus+=r.shares;   /* titres gratuits, coût nul */
      txn.push({d:r.date, acct:"TR", tk:TK(r.name), type:"G", qty:r.shares, px:0, amt:0});
    } else if(r.type==="FREE_RECEIPT"){
      B(r.name).qty+=r.shares;                                  /* transfert de garde */
    } else if(r.type==="DIVIDEND"){
      dividendes += r.amount + r.tax;                           /* tax est négative */
      txn.push({d:r.date, acct:"TR", tk:TK(r.name), type:"D", qty:0, px:0,
                amt:Math.round((r.amount+r.tax)*100)/100});
    } else if(r.type==="INTEREST_PAYMENT"){
      interets += r.amount;
    } else if(["CUSTOMER_INPAYMENT","CUSTOMER_INBOUND","TRANSFER_INSTANT_INBOUND","TRANSFER_INBOUND"].includes(r.type)){
      versements += r.amount;
    }
  }
  if(!nOps) throw new Error("Aucune opération de bourse trouvée dans ce fichier.");

  /* --- positions --- */
  const kept = S.positions.filter(p=>p.acct!=="TR");      /* Boursorama intact */
  const fresh = [];
  Object.keys(book).forEach(n=>{
    const b=book[n]; if(b.qty<1e-6) return;
    const m = TR_MAP[n] || [n.toUpperCase().slice(0,6),"EUR",n];
    const old = S.positions.find(p=>p.tk===m[0] && p.acct==="TR");
    fresh.push({id:"tr-"+m[0], name:m[2], tk:m[0], acct:"TR",
      qty:Math.round(b.qty*1e4)/1e4, pru:Math.round(b.cost/b.qty*1e4)/1e4,
      cur:m[1], ok:true, bonus:b.bonus||undefined,
      ordre:old&&old.ordre, ordreQty:old&&old.ordreQty, ordreSrc:old&&old.ordreSrc});
  });
  fresh.sort((a,b)=>a.name.localeCompare(b.name,"fr"));
  S.positions = kept.concat(fresh);

  /* --- plus-values encaissées : Trade Republic recalculé, Boursorama conservé --- */
  const keptReal = (S.realised||[]).filter(r=>r.acct && r.acct!=="TR");
  const newReal = Object.keys(sells).map(n=>{
    const m = TR_MAP[n] || [n.toUpperCase().slice(0,6),"EUR",n];
    const s = sells[n];
    return {tk:m[0], name:m[2], acct:"TR", qty:Math.round(s.qty*100)/100,
            prodEur:Math.round(s.prodEur*100)/100, gainEur:Math.round(s.gainEur*100)/100};
  });
  S.realised = keptReal.concat(newReal).sort((a,b)=>b.gainEur-a.gainEur);

  /* journal : Trade Republic rejoué, Boursorama conservé */
  S.txn = (S.txn||[]).filter(t=>t.acct!=="TR").concat(txn)
            .sort((a,b)=> a.d<b.d?-1:(a.d>b.d?1:0));

  S.income = {dividendes:Math.round(dividendes*100)/100,
              interets:Math.round(interets*100)/100,
              frais:Math.round(frais*100)/100,
              versements:Math.round(versements*100)/100};

  /* les cours ne sont pas dans l'export : on garde ceux déjà connus,
     et on crée une ligne de suivi pour toute valeur nouvelle. */
  fresh.forEach(p=>{
    if(!S.watchlist.find(w=>w.tk===p.tk))
      S.watchlist.push({name:p.name, tk:p.tk, recoEur:0, recoUsd:0,
        pxUsd: p.cur==="EUR" ? p.pru/S.fx : p.pru, pxEur: p.cur==="EUR" ? p.pru : p.pru*S.fx});
  });

  save(true);
  return {nOps, dLast, positions:fresh.length, sells:newReal.length, txn:txn.length,
          dividendes:S.income.dividendes, interets:S.income.interets,
          frais:S.income.frais, versements:S.income.versements,
          unknown:[...unknown]};
}

/* ================================================================
   COURS DEPUIS GOOGLE FINANCE
   Une page publiée n'a pas le droit d'aller chercher une adresse
   extérieure : le navigateur le lui interdit, et Google Finance exige
   la session d'Éric. En revanche le texte de la page a une forme
   régulière — ticker, puis « $142.23 9 » — qui se lit sans IA.
   ================================================================ */
const GF_URLS = {
  TR:"https://www.google.com/finance/beta/portfolio/19bded49-4978-40e3-b760-c95b445b49aa",
  BOURSO:"https://www.google.com/finance/beta/portfolio/610dbe78-f900-4d81-8c50-63a00c51fdd8"
};
const GF_BOOKMARKLET =
 "javascript:(function(){navigator.clipboard.writeText(document.body.innerText)"+
 ".then(function(){alert('Portefeuille copie. Colle-le dans Carnet de Cote.')},"+
 "function(){alert('Copie refusee par le navigateur.')})})()";

/* Google Finance ne nomme pas toujours une valeur comme nous : Xpeng y
   figure sous sa ligne de Francfort (8XPA, cotée en euros) alors que la
   position est suivie ici sous l'ADR XPEV. */
const GF_ALIAS = {"8XPA":"XPEV"};
const gfTicker = tk => GF_ALIAS[tk] || tk;

function numFr(v){
  const n = parseFloat(String(v).replace(/\s| /g,"").replace(/,/g,""));
  return isFinite(n) ? n : 0;
}

function parseGoogleFinance(text){
  const L = String(text||"").split(/\r?\n/).map(l=>l.trim());
  const found = {};
  /* « $142.23 9 » ou « €101.04 2 » : cours puis quantité détenue */
  const QUOTE = /^([$€])\s?([0-9][0-9., ]*)\s+([0-9][0-9., ]*)$/;
  const VALUE = /^€\s?([0-9][0-9., ]*)$/;          /* la valeur de la ligne, en euros */
  const TICK  = /^[A-Z0-9][A-Z0-9.]{0,7}$/;
  for(let i=0;i<L.length;i++){
    if(!TICK.test(L[i])) continue;
    const tk = L[i];
    for(let j=i+1;j<Math.min(i+6,L.length);j++){
      if(TICK.test(L[j]) && L[j]!==tk) break;      /* on a changé de valeur */
      const m = L[j].match(QUOTE);
      if(!m) continue;
      const px = numFr(m[2]), qty = numFr(m[3]);
      if(px<=0) break;
      /* la valeur en euros de la ligne suit quelques lignes plus bas ;
         rapportée au cours en dollars, elle donne le taux de change
         que Google applique — inutile d'aller le chercher ailleurs */
      let valEur = 0;
      for(let k=j+1;k<Math.min(j+10,L.length);k++){
        if(TICK.test(L[k])) break;
        const v = L[k].match(VALUE);
        if(v){ valEur = numFr(v[1]); break; }
      }
      const key = gfTicker(tk);
      found[key] = {tk:key, source:tk, cur: m[1]==="€" ? "EUR" : "USD", px, qty, valEur};
      break;
    }
  }
  return Object.values(found);
}

/* Taux USD→EUR implicite : médiane des rapports valeur/(cours×quantité)
   sur les lignes cotées en dollar dont la valeur en euros est lisible. */
function fxFromGoogle(rows){
  const t = rows.filter(r=>r.cur==="USD" && r.valEur>0 && r.px>0 && r.qty>0)
                .map(r=>r.valEur/(r.px*r.qty))
                .filter(x=>x>0.5 && x<1.5).sort((a,b)=>a-b);
  if(t.length<3) return 0;
  return t[Math.floor(t.length/2)];
}

function applyGoogleFinance(rows, majFx){
  let maj = 0; const inconnus = [], ecarts = [];
  let fxAvant = S.fx, fxApres = 0;
  if(majFx){
    const f = fxFromGoogle(rows);
    if(f && Math.abs(f - S.fx) > 0.0005){ S.fx = Math.round(f*1e5)/1e5; fxApres = S.fx; }
  }
  rows.forEach(r=>{
    const w = S.watchlist.find(x=>x.tk===r.tk);
    if(!w){ inconnus.push(r.source && r.source!==r.tk ? r.source+" ("+r.tk+")" : r.tk); return; }
    if(setPrice(r.tk, r.px, r.cur)) maj++;
    const pos = S.positions.find(p=>p.tk===r.tk && p.acct==="TR")
             || S.positions.find(p=>p.tk===r.tk);
    if(pos && r.qty>0 && Math.abs(pos.qty - r.qty) > Math.max(0.5, pos.qty*0.01))
      ecarts.push({tk:r.tk, ici:pos.qty, gf:r.qty});
  });
  if(maj || fxApres){ S.pxDate = today(); save(true); }
  return {maj, inconnus, ecarts, fxAvant, fxApres};
}

    if(!SAMPLE){

      applyPositions(n,acct); out.innerHTML=`<div class="callout a">${n.length} lignes reprises.</div>`;
      setTimeout(()=>{closeModal();view="pf";render();},900); return;
    }
    out.innerHTML='<div class="callout a">Analyse en cours…</div>';

        "pruEur est TOUJOURS en euros. Si seul un montant investi total en euros est donné, divise-le par la quantité ; "+
        "si seules la valeur et la plus-value latente en euros sont données, pruEur = (valeur - plus-value) / quantité.\n"+
        "Si une donnée manque vraiment, mets 0. N'invente aucune ligne absente du texte.\n\nTEXTE :\n"+txt.slice(0,50000),
        {modelTier:"default"}
      );
      const list=(data&&data.positions)||[];
      if(!list.length){ out.innerHTML='<div class="callout">Aucune position reconnue dans ce texte.</div>'; return; }

}

function applyPositions(list,acct){
  list.forEach(it=>{
    const tk=String(it.ticker||"").toUpperCase().trim();
    const name=String(it.name||tk).trim();
    if(!tk&&!name) return;
    const cur=(it.currency==="EUR")?"EUR":"USD";
    const key=tk||name.toUpperCase().slice(0,6);
    if(it.price>0){
      if(!S.watchlist.find(w=>w.tk===key)){
        S.watchlist.push({name,tk:key,recoEur:0,recoUsd:0,
          pxUsd:cur==="EUR"?it.price/S.fx:it.price, pxEur:cur==="EUR"?it.price:it.price*S.fx});
      } else setPrice(key,it.price,cur);
    }
    /* le collage donne un prix de revient dans la devise du titre ;
       faute de dates d'achat, il est converti au taux du jour */
    const pru = it.pru>0 ? it.pru : (it.pruEur>0 ? (cur==="EUR"? it.pruEur : it.pruEur/S.fx) : 0);
    const pe  = cur==="EUR" ? pru : pru*S.fx;
    const ex=S.positions.find(p=>p.tk===key&&p.acct===acct);
    if(ex){ ex.qty=it.qty||ex.qty; if(pru>0){ ex.pru=pru; ex.pruEur=pe; } ex.cur=cur; ex.ok=true; }
    else S.positions.push({id:"p"+Date.now()+Math.random().toString(36).slice(2,6),
      name,tk:key,acct,qty:it.qty||0,pru,pruEur:pe,cur,ok:true});
  });
  S.pxDate=today(); save(true);
}

function naiveParse(txt){
  const out=[];
  txt.split(/\r?\n/).forEach(l=>{
    const m=l.match(/^\s*([A-Za-z0-9.&' -]{2,40}?)\s+([0-9]+(?:[.,][0-9]+)?)\s*$/);
    if(m) out.push({name:m[1].trim(),ticker:m[1].trim().toUpperCase().slice(0,6),qty:0,pru:0,price:parseFloat(m[2].replace(",",".")),currency:"USD"});
  });
  return out;
}

async function parsePrices(){
  const ta=document.getElementById("pxPaste");
  const out=document.getElementById("parseOut");
  const txt=(ta&&ta.value||"").trim();
  if(txt.length<3){ out.innerHTML='<div class="callout">Colle d\'abord une liste de cours.</div>'; return; }

  /* lecture directe : « TICKER 217,44 » ou « Nom 217.44 » */
  let n=0;
  txt.split(/\r?\n/).forEach(l=>{
    const m=l.match(/^\s*([A-Za-z0-9.&' -]{1,40}?)[\s:]+([0-9][0-9\s.,]*)\s*(\$|€|USD|EUR)?\s*$/);
    if(!m) return;
    const key=m[1].trim().toUpperCase();
    const v=parseFloat(m[2].replace(/\s/g,"").replace(/\.(?=\d{3}\b)/g,"").replace(",","."));
    if(!isFinite(v)||v<=0) return;
    const w=S.watchlist.find(x=>x.tk.toUpperCase()===key||x.name.toUpperCase()===key);
    if(!w) return;
    const cur=(m[3]==="€"||m[3]==="EUR")?"EUR":(m[3]?"USD":(w.pxEur&&!w.pxUsd?"EUR":"USD"));
    if(setPrice(w.tk,v,cur)) n++;
  });

  if(n){ S.pxDate=today(); save(true); render();
    out.innerHTML=`<div class="callout a"><b>${n} cours mis à jour.</b> Tous les calculs suivent.</div>`; return; }

  if(!SAMPLE){ out.innerHTML='<div class="callout">Aucun ticker reconnu. Utilise le format <b>NVDA 217,44</b>, une valeur par ligne.</div>'; return; }
  out.innerHTML='<div class="callout a">Aucune ligne lue directement — analyse assistée en cours…</div>';
  try{
    const known=S.watchlist.map(w=>w.tk+" ("+w.name+")").join(", ");
    const data=await SAMPLE.json(
      "Extrais les cours de bourse du texte ci-dessous et associe-les aux tickers connus.\n"+
      "Tickers connus : "+known+"\n"+
      'Réponds UNIQUEMENT en JSON : {"prices":[{"ticker":"NVDA","price":217.44,"currency":"USD"}]}\n'+
      "N'inclus que les tickers de la liste ci-dessus effectivement présents dans le texte. Aucune invention.\n\nTEXTE :\n"+txt.slice(0,20000),
      {modelTier:"quick"});
    let k=0;
    ((data&&data.prices)||[]).forEach(p=>{ if(setPrice(String(p.ticker||"").toUpperCase(),p.price,p.currency==="EUR"?"EUR":"USD")) k++; });
    if(k){ S.pxDate=today(); save(true); render();
      out.innerHTML=`<div class="callout a"><b>${k} cours mis à jour.</b></div>`; }
    else out.innerHTML='<div class="callout">Aucun cours exploitable dans ce texte.</div>';
  }catch(e){
    out.innerHTML='<div class="callout">L\'analyse n\'a pas abouti. Utilise le format <b>NVDA 217,44</b>, une valeur par ligne.</div>';
  }
}

/* ---------- snapshot ---------- */
function snapshot(){
  const C=computed();
  const d=today();
  const pt={d,total:C.total,tr:(C.byAcct.TR||{}).val||0,pea:(C.byAcct.BOURSO||{}).val||0};
  const i=S.history.findIndex(p=>p.d===d);
  if(i>=0) S.history[i]=pt; else S.history.push(pt);
  S.history.sort((a,b)=>a.d<b.d?-1:1);
  if(S.history.length>400) S.history=S.history.slice(-400);
  save(true);                       /* geste délibéré : écriture immédiate */
  view = "hist"; render();          /* on montre le relevé qui vient d'être posé */
  toast((i>=0?"Point du ":"Point du ")+frDate(d)+" enregistré : "+eur(C.total)+
        " · "+S.history.length+" relevés");
}

/* ---------- export ---------- */
function buildCsv(){
  const C=computed();
  const head=["Compte","Valeur","Ticker","Secteur","Quantite","Devise","PRU_devise","PRU_EUR","Cours",
              "Perf_titre_pct","Valeur_EUR","Cout_EUR","PV_EUR","Perf_EUR_pct","Poids_pct","Palier",
              "Ordre_prix","Ordre_titres","Ordre_ecart_pct"];
  const lines=[head.join(";")].concat(C.rows.map(r=>[
    ACCOUNTS[r.acct]?ACCOUNTS[r.acct].label:r.acct, r.name, r.tk, r.sector,
    r.qty, r.cur, r.pru.toFixed(4), pruEur(r).toFixed(4), r.pn.toFixed(4),
    r.perf.toFixed(2), r.val.toFixed(2), r.cost.toFixed(2), r.pl.toFixed(2),
    r.perf.toFixed(2), r.weight.toFixed(2), r.palier,
    r.ordre||"", r.ordreQty||"", r.ordreGap==null?"":r.ordreGap.toFixed(2)
  ].join(";")));
  lines.push("");
  lines.push("PLUS-VALUES REALISEES");
  lines.push(["Valeur","Ticker","Compte","Titres_vendus","Produit_EUR","PV_EUR"].join(";"));
  (S.realised||[]).forEach(r=>lines.push([r.name,r.tk,ACCOUNTS[r.acct]?ACCOUNTS[r.acct].label:"",r.qty,
    r.prodEur.toFixed(2),r.gainEur.toFixed(2)].join(";")));
  lines.push(["TOTAL","","","",C.proceeds.toFixed(2),C.realised.toFixed(2)].join(";"));
  return "﻿"+lines.join("\n");
}
async function exportCsv(){
  const csv=buildCsv();
  const filename="carnet-de-cote-"+today()+".csv";
  if(DL){
    try{ await DL.save({filename,data:csv}); toast("Fichier enregistré"); return; }
    catch(e){
      if(e && e.code==="declined") return;
      if(e && e.code==="rate_limited"){ toast("Une demande d'enregistrement est déjà ouverte."); return; }
    }
  }
  showCsv(csv);
}
function showCsv(csv){
  const m=modal(`<h3>Export CSV</h3>
    <p class="lead">L'enregistrement direct n'est pas disponible ici. Sélectionne tout et copie — le fichier s'ouvre tel quel dans Excel, Numbers ou Google Sheets (séparateur point-virgule).</p>
    <textarea rows="12" id="csvOut" readonly></textarea>
    <div class="actions"><button class="btn" id="cClose">Fermer</button><button class="btn primary" id="cCopy">Copier</button></div>`);
  m.querySelector("#csvOut").value=csv;
  m.querySelector("#cClose").onclick=closeModal;
  m.querySelector("#cCopy").onclick=()=>{
    const ta=m.querySelector("#csvOut"); ta.select();
    try{ navigator.clipboard.writeText(ta.value); toast("CSV copié"); }
    catch(e){ toast("Sélectionne le texte puis Ctrl+C"); }
  };
}

function initTheme(){
  let t=null;
  try{ t=localStorage.getItem("cdc-theme"); }catch(e){}
  if(t) document.documentElement.setAttribute("data-theme",t);
  document.getElementById("btnTheme").onclick=()=>{
    const cur=document.documentElement.getAttribute("data-theme");
    const sysDark=window.matchMedia("(prefers-color-scheme: dark)").matches;
    const next = cur ? (cur==="dark"?"light":"dark") : (sysDark?"light":"dark");
    document.documentElement.setAttribute("data-theme",next);
    try{ localStorage.setItem("cdc-theme",next); }catch(e){}
  };
}

const FIREBASE_CONFIG = {

  authDomain: "carnet-de-cote.firebaseapp.com",

/* Le document est fixe (une seule "ligne" pour tout le portefeuille) :
   son chemin doit correspondre exactement à la règle Firestore publiée. */
function firebaseDbShim(){
  firebase.initializeApp(FIREBASE_CONFIG);
  const fs = firebase.firestore();
  const ref = fs.collection("carnet").doc("x7k2m9p4q1");
  return {
    doc(){
      return {
        get: () => ref.get().then(snap=>({exists:snap.exists, data:()=>snap.data()})),
        set: (obj) => ref.set(obj),
        onSnapshot: (cb, errCb) => ref.onSnapshot(
          snap => cb({exists:snap.exists, data:()=>snap.data(),
                       metadata:{hasPendingWrites:snap.metadata.hasPendingWrites}}),
          errCb
        )
      };
    }
  };
}

/* Cours en direct via Twelve Data (offre gratuite). TD_KEY est renseignée
   par Éric — sans elle, ce bloc ne fait rien et les boutons manuels
   (Google Finance / import Trade Republic) restent la seule source. */
const TD_KEY = "3f97ca19a2d44967a348923e1dedd3e2";
/* tickers dont le symbole Twelve Data diffère du ticker watchlist */
const TD_SYMBOL = { ".INX":"SPX", ".IXIC":"IXIC" };
/* valeurs non couvertes par l'API (bourses non supportées en offre
   gratuite) : leur cours reste manuel, via "Actualiser les cours" */
const TD_SKIP = ["P911","CATL","688836"];
let lastLiveRefresh = null;

/* Le plan gratuit Twelve Data limite à 8 crédits/minute (1 symbole = 1 crédit).
   On découpe donc les requêtes en petits lots espacés dans le temps plutôt
   que d'envoyer les ~25 valeurs d'un coup (ce qui déclenchait un 429). */
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
const TD_CHUNK = 7;
const TD_DELAY_MS = 61000;

async function fetchLivePrices(){
  if(!TD_KEY) return;
  const lignes = S.watchlist.filter(w=>!TD_SKIP.includes(w.tk));
  if(!lignes.length) return;
  const el = document.getElementById("liveFoot");
  let maj=0; const echecs=[]; let erreurReseau=false;

  try{
    const fxRes = await fetch("https://api.twelvedata.com/exchange_rate?symbol=USD/EUR&apikey="+TD_KEY).then(r=>r.json());
    if(fxRes && fxRes.rate){ S.fx = Math.round(parseFloat(fxRes.rate)*1e5)/1e5; }
  }catch(e){ erreurReseau=true; }

  for(let i=0;i<lignes.length;i+=TD_CHUNK){
    const lot = lignes.slice(i, i+TD_CHUNK);
    const symbols = lot.map(w=>TD_SYMBOL[w.tk]||w.tk);
    try{
      const prixRes = await fetch("https://api.twelvedata.com/price?symbol="+encodeURIComponent(symbols.join(","))+"&apikey="+TD_KEY).then(r=>r.json());
      lot.forEach((w,j)=>{
        const sym = symbols[j];
        const entry = symbols.length>1 ? prixRes[sym] : prixRes;
        const val = entry && parseFloat(entry.price);
        if(val>0){ setPrice(w.tk, val, "USD"); maj++; } else { echecs.push(w.tk); }
      });
    }catch(e){ erreurReseau=true; lot.forEach(w=>echecs.push(w.tk)); }
    if(maj){ S.pxDate = today(); save(true); render(); }
    if(el) el.textContent = "Cours en direct · mise à jour en cours ("+Math.min(i+TD_CHUNK,lignes.length)+"/"+lignes.length+")";
    if(i+TD_CHUNK < lignes.length) await sleep(TD_DELAY_MS);
  }

  lastLiveRefresh = new Date();
  const hh = String(lastLiveRefresh.getHours()).padStart(2,"0")+":"+String(lastLiveRefresh.getMinutes()).padStart(2,"0");
  if(el){
    if(erreurReseau && !maj) el.textContent = "Cours en direct indisponible (réessai automatique)";
    else el.textContent = "Cours en direct · "+hh+(echecs.length?(" · "+echecs.length+" valeur(s) manuelle(s)"):"");
  }
  render();
}

/* branche la persistance (Firestore ou capacité Claude) une fois pour
   toutes : identique dans les deux cas, seule la source diffère. */
function wireDb(db){
  DB=db;
  const ref=db.doc("portfolio/state");
  ref.get().then(snap=>{
    if(snap.exists){
      S = normalize(snap.data(), S);
      saveLocal(); render();
      if(pending) save(true);
    } else {
      ref.set(JSON.parse(JSON.stringify(S))).catch(()=>{});
    }
    setSync("Synchronisé sur tous tes appareils");
    ref.onSnapshot(sn=>{
      if(!sn.exists || sn.metadata.hasPendingWrites) return;
      if(pending){
        S.history = mergeHistory(S.history, degeler((sn.data()||{}).history));
        saveLocal(); render();
        return;
      }
      S = normalize(sn.data(), S);
      saveLocal(); render();
    }, ()=>setSync("Synchronisation interrompue — enregistré sur cet appareil"));
  }).catch(()=>setSync("Stockage local (cet appareil)"));
}

/* ================================================================
   9. DÉMARRAGE
   ================================================================ */
function boot(){
  S = normalize(loadLocal());
  initTheme();

  document.getElementById("nav").onclick=e=>{
    const b=e.target.closest("button[data-v]"); if(!b) return;
    view=b.dataset.v; filterText=""; jType="ALL"; jYear="ALL"; notice=null; render();
  };
  document.getElementById("btnSnap").onclick=snapshot;
  document.getElementById("btnGF").onclick=openGF;
  document.getElementById("btnImportTR").onclick=openImportTR;
  document.getElementById("btnExport").onclick=exportCsv;

  render();

  /* capacités — la page marche sans elles, elles s'allument après coup */
  if(window.claude && typeof window.claude.use==="function"){
    setSync("Synchronisation…");
    window.claude.use("db").then(db=>{
      if(!db){ setSync("Stockage local (cet appareil)"); return; }
      wireDb(db);
    }).catch(()=>setSync("Stockage local (cet appareil)"));
    window.claude.use("sample").then(s=>{ if(s) SAMPLE=s; }).catch(()=>{});
    window.claude.use("downloads").then(d=>{ if(d) DL=d; }).catch(()=>{});
  } else if(typeof firebase!=="undefined"){
    setSync("Synchronisation…");
    try{ wireDb(firebaseDbShim()); }
    catch(e){ setSync("Stockage local (cet appareil)"); }
  } else {
    setSync("Stockage local (cet appareil)");
  }

  /* cours en direct : au chargement, puis toutes les 20 minutes */
  fetchLivePrices();
  setInterval(fetchLivePrices, 20*60*1000);
}

if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",boot);
else boot();
